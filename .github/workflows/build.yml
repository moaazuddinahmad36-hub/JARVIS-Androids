name: Build JARVIS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and unpack JARVIS ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -type f -iname "*JARVIS*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "JARVIS ZIP not found!"
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"

          rm -rf android-project
          mkdir -p android-project

          unzip -q "$ZIP_FILE" -d android-project

          echo "Project files:"
          find android-project -maxdepth 3 -type f

      - name: Fix AndroidX configuration
        shell: bash
        run: |
          set -e

          echo "android.useAndroidX=true" > android-project/gradle.properties
          echo "android.enableJetifier=true" >> android-project/gradle.properties

          echo "gradle.properties:"
          cat android-project/gradle.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK
        shell: bash
        run: |
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"
          yes | sdkmanager --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build JARVIS APK
        shell: bash
        run: |
          set -e

          cd android-project

          echo "Starting Gradle build..."

          gradle --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Find APK
        shell: bash
        run: |
          echo "Searching for APK..."
          find android-project -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-debug-APK
          path: |
            android-project/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
