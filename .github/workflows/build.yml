name: Build JARVIS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and unpack JARVIS ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -type f -iname "*JARVIS*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "JARVIS ZIP not found!"
            exit 1
          fi

          rm -rf android-project
          mkdir -p android-project
          unzip -q "$ZIP_FILE" -d android-project

          echo "JARVIS project extracted."

      - name: Fix JARVIS source code
        shell: bash
        run: |
          set -e

          MAIN_FILE=$(find android-project -type f -name "MainActivity.kt" | head -n 1)

          if [ -z "$MAIN_FILE" ]; then
            echo "MainActivity.kt NOT FOUND"
            exit 1
          fi

          echo "Found: $MAIN_FILE"

          python3 - "$MAIN_FILE" <<'PY'
          import sys

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              s = f.read()

          old1 = "val x = cx + p.x * base * heartbeat * motion"
          old2 = "val y = cy + p.y * base * heartbeat * motion"

          new1 = "val x = (cx.toDouble() + p.x.toDouble() * base.toDouble() * heartbeat.toDouble() * motion.toDouble()).toFloat()"
          new2 = "val y = (cy.toDouble() + p.y.toDouble() * base.toDouble() * heartbeat.toDouble() * motion.toDouble()).toFloat()"

          if old1 not in s:
              print("WARNING: x line was not found")
          else:
              s = s.replace(old1, new1)

          if old2 not in s:
              print("WARNING: y line was not found")
          else:
              s = s.replace(old2, new2)

          with open(path, "w", encoding="utf-8") as f:
              f.write(s)

          print("Source code fix applied.")
          PY

          echo "Checking fixed lines:"
          grep -n "val x =\|val y =" "$MAIN_FILE" | tail -n 5

      - name: Fix AndroidX and JVM configuration
        shell: bash
        run: |
          set -e

          cat > android-project/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          kotlin.jvm.target.validation.mode=error
          EOF

          cat >> android-project/app/build.gradle.kts <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK
        shell: bash
        run: |
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"
          yes | sdkmanager --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build JARVIS APK
        shell: bash
        run: |
          set -e
          cd android-project

          echo "Building JARVIS APK..."

          gradle --no-daemon --stacktrace assembleDebug

      - name: Find APK
        shell: bash
        run: |
          echo "APK files:"
          find android-project -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-debug-APK
          path: |
            android-project/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
