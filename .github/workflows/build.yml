name: Build JARVIS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and unpack JARVIS ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -type f -iname "*JARVIS*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "JARVIS ZIP not found!"
            exit 1
          fi

          rm -rf android-project
          mkdir -p android-project
          unzip -q "$ZIP_FILE" -d android-project

          echo "JARVIS project extracted."

      - name: Insert Gemini API key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        run: |
          set -e

          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY secret is missing!"
            exit 1
          fi

          python3 <<'PY'
          import os

          root = "android-project/app/src"
          key = os.environ["GEMINI_API_KEY"]

          replacements = 0

          for dirpath, _, filenames in os.walk(root):
              for filename in filenames:
                  if not filename.endswith((".kt", ".java", ".xml")):
                      continue

                  path = os.path.join(dirpath, filename)

                  try:
                      with open(path, "r", encoding="utf-8") as f:
                          text = f.read()
                  except Exception:
                      continue

                  old = text

                  text = text.replace(
                      "PUT_YOUR_GEMINI_API_KEY_HERE",
                      key
                  )

                  if text != old:
                      with open(path, "w", encoding="utf-8") as f:
                          f.write(text)
                      replacements += 1
                      print("Updated:", path)

          print("API key placeholder replacements:", replacements)

          if replacements == 0:
              print("WARNING: API key placeholder was not found.")
          PY

      - name: Diagnose Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "       TESTING GEMINI API KEY"
          echo "======================================"

          HTTP=$(curl -sS -o /tmp/gemini.json -w "%{http_code}" \
            -H "x-goog-api-key: $GEMINI_API_KEY" \
            "https://generativelanguage.googleapis.com/v1beta/models")

          echo "Gemini API HTTP status: $HTTP"

          python3 - <<'PY'
          import re

          p = "/tmp/gemini.json"

          with open(p, encoding="utf-8") as f:
              s = f.read()

          s = re.sub(
              r'AIza[0-9A-Za-z_-]+',
              '[REDACTED_KEY]',
              s
          )

          print(s[:5000])
          PY

          echo ""
          echo "======================================"
          echo "       INTERNET PERMISSION"
          echo "======================================"

          grep -n "android.permission.INTERNET" \
            android-project/app/src/main/AndroidManifest.xml || true

          echo ""
          echo "======================================"
          echo "       GEMINI SOURCE"
          echo "======================================"

          MAIN_FILE=$(find android-project -type f -name "MainActivity.kt" | head -n 1)

          if [ -z "$MAIN_FILE" ]; then
            echo "MainActivity.kt NOT FOUND"
            exit 1
          fi

          python3 - "$MAIN_FILE" <<'PY'
          import sys
          import re

          p = sys.argv[1]

          with open(p, encoding="utf-8") as f:
              s = f.read()

          s = re.sub(
              r'AIza[0-9A-Za-z_-]+',
              '[REDACTED_KEY]',
              s
          )

          for i, line in enumerate(s.splitlines(), 1):
              if re.search(
                  r'gemini|generativelanguage|generateContent|models/',
                  line,
                  re.I
              ):
                  print(f"{i}: {line}")
          PY

      - name: Fix JARVIS source code
        shell: bash
        run: |
          set -e

          MAIN_FILE=$(find android-project -type f -name "MainActivity.kt" | head -n 1)

          if [ -z "$MAIN_FILE" ]; then
            echo "MainActivity.kt NOT FOUND"
            exit 1
          fi

          python3 - "$MAIN_FILE" <<'PY'
          import sys

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              s = f.read()

          old1 = "val x = cx + p.x * base * heartbeat * motion"
          old2 = "val y = cy + p.y * base * heartbeat * motion"

          new1 = "val x = (cx.toDouble() + p.x.toDouble() * base.toDouble() * heartbeat.toDouble() * motion.toDouble()).toFloat()"
          new2 = "val y = (cy.toDouble() + p.y.toDouble() * base.toDouble() * heartbeat.toDouble() * motion.toDouble()).toFloat()"

          s = s.replace(old1, new1)
          s = s.replace(old2, new2)

          with open(path, "w", encoding="utf-8") as f:
              f.write(s)

          print("JARVIS source compatibility fix applied.")
          PY

      - name: Fix AndroidX and JVM configuration
        shell: bash
        run: |
          set -e

          cat > android-project/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          kotlin.jvm.target.validation.mode=error
          EOF

          cat >> android-project/app/build.gradle.kts <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK
        shell: bash
        run: |
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"
          yes | sdkmanager --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build JARVIS APK
        shell: bash
        run: |
          set -e
          cd android-project
          gradle --no-daemon --stacktrace assembleDebug

      - name: Find APK
        shell: bash
        run: |
          find android-project -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-debug-APK
          path: |
            android-project/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
